name: Sync upstream

on:
  schedule:
    # Segunda-feira 12:00 UTC (~09:00 Brasil)
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RESULT=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/merge-upstream" \
            -f branch=main)
          echo "$RESULT"
          echo "$RESULT" | grep -qi 'already up to date\|merged\|fast-forward\|success\|message' || true
